# The suite runs on every push, so the repository proves itself rather than asserting that
# it passes. Three of the calibration tests are Monte Carlo coverage measurements and are the
# slowest thing here; they are also the ones that license the interval claim in ADR-001, so
# they are not marked slow and skipped.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor the pinned dependencies actually allow (numpy 2.5.2 publishes no
        # 3.11 wheel) and 3.13 is the other version Streamlit Cloud offers. Testing a version
        # the deployment cannot run would be theatre; not testing one it can is a gap.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Installs ./engine as a package, which is also how the deployment resolves
          # `import scrcae`. Running the suite against the installed package rather than the
          # source tree is what catches a module that only imports because of PYTHONPATH.
          pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q -p no:warnings

      - name: Check the solver is really CBC
        # PuLP silently falls back to whatever solver it can find. The parity constants in
        # the suite assume CBC, so a host without it would produce green tests that mean
        # something different.
        run: |
          python -c "
          import pulp
          solver = pulp.PULP_CBC_CMD(msg=False)
          assert solver.available(), 'CBC not available'
          print('CBC available:', solver.path)
          "
